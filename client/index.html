<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>OpenGrokBot</title>
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 17c0-8 6-13 12-13s12 5 12 12c0 7-5 11-12 11S4 24 4 17z' fill='%23ff6a1a'/%3E%3Ccircle cx='12' cy='16' r='2' fill='%23111'/%3E%3Ccircle cx='20' cy='16' r='2' fill='%23111'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-content:center;gap:16px;background:#141414;color:#eee;font:16px system-ui;text-align:center">
        <strong>OpenGrokBot</strong>
        <p id="boot-detail" role="status">正在打开聊天界面…</p>
        <button type="button" onclick="location.reload()" style="padding:10px;border-radius:8px;cursor:pointer">重新加载</button>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement)) return
        var detail = document.getElementById('boot-detail')
        if (detail) detail.textContent = '页面文件加载失败，请重新加载。如果仍然失败，请检查本地服务是否正在运行。'
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").catch(() => {})
    </script>
  </body>
</html>
